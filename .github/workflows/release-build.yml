name: Release Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*' # Matches SemVer tags like v1.0.0, v2.1.3, etc.
      - 'v*.*.*-*' # Matches pre-release tags like v1.0.0-alpha, v1.0.0-beta, v1.0.0-rc

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r setup/requirements.txt
          pip install pyinstaller

      # Build binaries
      - name: Build binaries
        run: |
          pyinstaller --onefile --windowed --name "ImageCompare" app/image_compare_pyqt.py

      # Build macOS App
      - name: Build macOS App
        run: |
          pyinstaller --windowed --name "ImageCompare" --target-architecture universal2 app/image_compare_pyqt.py
          zip -r ImageCompare-${{ github.ref_name }}.zip dist/ImageCompare.app

      # Create a release and upload binaries
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }} # Mark as prerelease if tag contains a hyphen
          generate_release_notes: true

      # Upload Release Assets
      - name: Upload Release Assets
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ImageCompare-${{ github.ref_name }}.zip
          asset_name: ImageCompare-${{ github.ref_name }}.zip
          content_type: application/zip
