name: Nightly Build

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  build:
    if: github.ref == 'refs/heads/develop'

    strategy:
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r setup/requirements.txt pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name "ImageCompare" app/image_compare_pyqt.py

      - name: Generate timestamp
        id: timestamp
        run: |
          echo "BUILD_DATE=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Rename executable
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            mv dist/ImageCompare.app dist/ImageCompare-nightly-${{ BUILD_DATE }}.app
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            mv dist/ImageCompare dist/ImageCompare-nightly-${{ BUILD_DATE }}
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            mv dist/ImageCompare.exe dist/ImageCompare-nightly-${{ BUILD_DATE }}.exe
          fi
        shell: bash

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          path: dist/*
