name: Nightly Build

on:
  schedule:
    - cron: '0 4 * * *' # Runs daily at 04:00 UTC
  workflow_dispatch: # Allows manual triggering of the workflow
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: macos-latest # Use macOS runner

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r setup/requirements.txt
          pip install pyinstaller

      # Build macOS App
      - name: Build macOS App
        run: |
          pyinstaller --windowed --name "ImageCompare" --target-architecture universal2 app/image_compare_pyqt.py
          zip -r ImageCompare-${{ steps.timestamp.outputs.date }}.zip dist/ImageCompare.app

      # Generate timestamp for unique artifact name
      - name: Generate timestamp
        id: timestamp
        run: |
          echo "::set-output name=date::$(date +'%Y%m%d-%H%M%S')"

      # Upload binaries as artifacts
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ImageCompare-${{ steps.timestamp.outputs.date }}.zip
          path: ImageCompare-${{ steps.timestamp.outputs.date }}.zip
