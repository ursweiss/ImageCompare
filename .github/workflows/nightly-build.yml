name: Nightly Build

on:
  schedule:
    - cron: '0 4 * * *' # Runs daily at 04:00 UTC
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  build:
    if: github.ref == 'refs/heads/develop' # Only run if changes are on the develop branch
    runs-on: macos-latest # Use macOS runner

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r setup/requirements.txt
          pip install pyinstaller

      # Build macOS App
      - name: Build macOS App
        run: |
          pyinstaller --windowed --name "ImageCompare" --target-architecture universal2 app/image_compare_pyqt.py

      # Generate timestamp for unique artifact name
      - name: Generate timestamp
        id: timestamp
        run: |
          echo "BUILD_DATE=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      # Upload binaries as artifacts
      - name: Upload binaries
        env:
          BUILD_DATE: ${{ steps.timestamp.outputs.BUILD_DATE }}
        uses: actions/upload-artifact@v4
        with:
          name: ImageCompare-$BUILD_DATE.app
          path: dist/ImageCompare.app
